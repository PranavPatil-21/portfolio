<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Content Admin</title>
  </head>
  <body>
    <!--
      Sveltia CMS is a single-page app served from a CDN — no build step and no
      dependency in this repo. The version is pinned to a minor range: an
      unpinned URL would silently break this admin on an upstream release, on a
      site nobody is watching. Do not add a stylesheet or type="module": all
      styling is bundled inside the script, and the module attribute breaks it.
    -->
    <script src="https://unpkg.com/@sveltia/cms@^0.201.2/dist/sveltia-cms.js"></script>
  </body>
</html>
