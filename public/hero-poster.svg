<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="presentation" aria-hidden="true">
  <!--
    First-paint placeholder for the particle portrait.

    Deliberately abstract: a soft accent bloom with no recognisable shape. It
    holds the composition for the moment before the point cloud resolves, and
    it is what remains for anyone without WebGL. An earlier version drew a
    wireframe solid, which stayed visible behind the portrait and read as an
    unrelated object floating in the scene.
  -->
  <defs>
    <radialGradient id="bloom" cx="52%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#6d4aff" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#6d4aff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="72%" cy="72%" r="46%">
      <stop offset="0%" stop-color="#9d8bff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9d8bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="none"/>
  <rect width="1200" height="800" fill="url(#bloom)"/>
  <rect width="1200" height="800" fill="url(#cool)"/>
</svg>
